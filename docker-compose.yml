version: '3.8'

services:
  backend:
    build:
      context: ./backend
    image: mova-backend-image
    container_name: mova-backend-container
    ports:
      - "3000:3000"
      - "5555:5555"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    networks:
      - mova-network

  db:
    image: postgres:15
    container_name: mova-db
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    networks:
      - mova-network

  redis:
    image: redis:7
    container_name: mova-redis
    ports:
      - "6379:6379"
    networks:
      - mova-network

networks:
  mova-network:
    driver: bridge