services:
  backend:
    build:
      context: ./backend
    image: mova-backend-image
    container_name: mova-backend-container
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5555:5555"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mova-network
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  db:
    image: postgis/postgis:15-3.3
    container_name: mova-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - mova-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: mova-redis
    ports:
      - "6379:6379"
    networks:
      - mova-network

  mova-admin:
    build:
      context: ./mova-admin
    image: mova-admin-image
    container_name: mova-admin-container
    ports:
      - "3002:3000" # Port exposé par mova-admin
    networks:
      - mova-network
    environment:
      - REACT_APP_API_URL=http://mova-backend-container:3000
    volumes:
      - ./mova-admin:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next

networks:
  mova-network:
    driver: bridge

volumes:
  postgres_data: