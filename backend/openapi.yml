openapi: 3.0.3
info:
  title: Mova API
  description: API pour la plateforme de matching entre candidats et recruteurs (JWT, Géolocalisation).
  version: 1.3.0

servers:
  - url: /
    description: Serveur local

tags:
  - name: Auth
    description: Gestion de l'authentification via JWT (JSON Web Tokens)
  - name: Profile
    description: Gestion du profil de l'utilisateur connecté
  - name: Geolocation & Discovery
    description: Routes pour la géolocalisation et la découverte d'offres
  - name: Companies
    description: Gestion des entreprises par les recruteurs
  - name: Job Offers
    description: Gestion et consultation des offres d'emploi
  - name: Meta
    description: Données de référence publiques
  - name: Swipes
    description: Actions de swipe pour les candidats et recruteurs
  - name: Matches & Applications
    description: Consultation des matches et des candidatures
  - name: Admin
    description: Routes réservées aux administrateurs

paths:
  # --- AUTH ---
  /auth/signup:
    post:
      summary: Crée un nouvel utilisateur
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupDto'
            example:
              email: "candidate@example.com"
              password: "Password123"
              role: "CANDIDATE"
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                refreshToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

  /auth/login:
    post:
      summary: Authentifie un utilisateur et renvoie les tokens
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
            example:
              email: "candidate@example.com"
              password: "Password123"
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }

  /auth/logout:
    post:
      summary: Déconnecte l'utilisateur (utilise l'accessToken dans l'Authorization header)
      tags: [Auth]
      security: [ { "bearerAuth": [] } ]
      responses:
        '200': { description: Déconnecté }

  /auth/refresh:
    post:
      summary: Renouvelle le token d'accès (utilise le refreshToken dans l'Authorization header)
      tags: [Auth]
      security: [ { "bearerAuth": [] } ]
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --- PROFILE ---
  /profile/me:
    get:
      summary: Récupérer le profil de l'utilisateur connecté
      tags: [Profile]
      security: [ { "bearerAuth": [] } ]
      responses:
        '200':
          description: Données du profil de l'utilisateur.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CandidateProfile'
                  - $ref: '#/components/schemas/RecruiterProfile'
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Mettre à jour le profil de l'utilisateur connecté
      tags: [Profile]
      security: [ { "bearerAuth": [] } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateProfileDto'
      responses:
        '200': { description: "Profil mis à jour avec succès." }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /profile/categories:
    get:
      summary: Récupérer la liste des catégories de métiers pour le profil
      tags: [Profile]
      responses:
        '200':
          description: Une liste de catégories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobCategory'

  # --- GEOLOCATION & DISCOVERY ---
  /profile/location:
    put:
      summary: Met à jour la position géographique du profil connecté
      tags: [Geolocation & Discovery]
      security: [ { "bearerAuth": [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationDto'
      responses:
        '200':
          description: Position mise à jour avec succès.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /profile/photo:
    put:
      summary: Met à jour la photo de profil
      tags: [Profile]
      security: [ { "bearerAuth": [] } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photoFile]
              properties:
                photoFile:
                  type: string
                  format: binary
      responses:
        '200': { description: Photo mise à jour avec succès. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /profile/resume:
    put:
      summary: Met à jour le CV
      tags: [Profile]
      security: [ { "bearerAuth": [] } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [resumeFile]
              properties:
                resumeFile:
                  type: string
                  format: binary
      responses:
        '200': { description: CV mis à jour avec succès. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      summary: Supprime le CV
      tags: [Profile]
      security: [ { "bearerAuth": [] } ]
      responses:
        '200': { description: CV supprimé avec succès. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /profile/push-token:
    post:
      summary: Met à jour le token push de l'utilisateur
      tags: [Profile]
      security: [ { "bearerAuth": [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200': { description: Token push mis à jour avec succès. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /discovery/recruiters:
    get:
      summary: (Candidat) Récupère la liste des recruteurs pour découverte
      tags: [Geolocation & Discovery]
      security: [ { "bearerAuth": [] } ]
      parameters:
        - name: radius
          in: query
          required: false
          schema:
            type: integer
            default: 20000
        - name: latitude
          in: query
          required: false
          schema:
            type: string
        - name: longitude
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Une liste de recruteurs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecruiterProfile'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /discovery/candidates:
    get:
      summary: (Recruteur) Récupère la liste des candidats pour découverte
      tags: [Geolocation & Discovery]
      security: [ { "bearerAuth": [] } ]
      parameters:
        - name: radius
          in: query
          required: false
          schema:
            type: integer
            default: 20000
        - name: latitude
          in: query
          required: false
          schema:
            type: string
        - name: longitude
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Une liste de candidats.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CandidateProfile'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /discovery/pending-candidates:
    get:
      summary: (Recruteur) Récupère les candidats en attente
      tags: [Geolocation & Discovery]
      security: [ { "bearerAuth": [] } ]
      responses:
        '200':
          description: Une liste de candidats en attente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CandidateProfile'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /meta/roles:
    get:
      summary: Récupérer les rôles disponibles
      tags: [Meta]
      responses:
        '200':
          description: Liste des rôles.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /meta/contract-types:
    get:
      summary: Récupérer les types de contrat disponibles
      tags: [Meta]
      responses:
        '200':
          description: Liste des types de contrat.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /meta/experience-levels:
    get:
      summary: Récupérer les niveaux d'expérience disponibles
      tags: [Meta]
      responses:
        '200':
          description: Liste des niveaux d'expérience.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /meta/job-categories:
    get:
      summary: Récupérer la liste des catégories de métiers
      tags: [Meta]
      responses:
        '200':
          description: Une liste de catégories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobCategory'

  # --- COMPANIES ---
  /companies/onboarding:
    post:
      summary: (Recruteur) Crée une entreprise et rattache le recruteur
      tags: [Companies]
      security: [ { "bearerAuth": [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyDto'
      responses:
        '201':
          content:
            application/json: { schema: { $ref: '#/components/schemas/Company' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # --- JOB OFFERS ---
  /job-offers:
    get:
      summary: Récupère la liste des offres d'emploi
      tags: [Job Offers]
      responses:
        '200':
          description: Liste des offres d'emploi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobOffer'
    post:
      summary: (Recruteur) Créer une offre d'emploi
      tags: [Job Offers]
      security: [ { "bearerAuth": [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobOfferDto'
      responses:
        '201':
          content:
            application/json: { schema: { $ref: '#/components/schemas/JobOffer' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /job-offers/my-offers:
    get:
      summary: (Recruteur) Récupère les offres créées par l'utilisateur connecté
      tags: [Job Offers]
      security: [ { "bearerAuth": [] } ]
      responses:
        '200':
          description: Liste des offres du recruteur.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobOffer'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /job-offers/{id}:
    get:
      summary: Obtenir les détails d'une offre d'emploi
      tags: [Job Offers]
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      responses:
        '200':
          content:
            application/json: { schema: { $ref: '#/components/schemas/JobOffer' } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: (Recruteur) Mettre à jour une offre d'emploi
      tags: [Job Offers]
      security: [ { "bearerAuth": [] } ]
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobOfferDto'
      responses:
        '200':
          content:
            application/json: { schema: { $ref: '#/components/schemas/JobOffer' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: (Recruteur) Supprimer une offre d'emploi
      tags: [Job Offers]
      security: [ { "bearerAuth": [] } ]
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      responses:
        '204': { description: "Offre supprimée avec succès." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- SWIPES ---
  /swipes:
    post:
      summary: Enregistre un swipe (candidat ou recruteur)
      tags: [Swipes]
      security: [ { "bearerAuth": [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateSwipeDto'
            example:
              profileId: "11111111-1111-1111-1111-111111111111"
              direction: "RIGHT"
      responses:
        '201':
          description: Swipe enregistré. Retourne un état de match.
          content:
            application/json:
              schema:
                type: object
                properties: { isMatch: { type: boolean } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /swipes/undo:
    delete:
      summary: Annule le dernier swipe
      tags: [Swipes]
      security: [ { "bearerAuth": [] } ]
      responses:
        '200': { description: Swipe annulé }

  # --- MATCHES & APPLICATIONS ---
  /matches:
    get:
      summary: Obtenir la liste des matches de l'utilisateur
      tags: [Matches & Applications]
      security: [ { "bearerAuth": [] } ]
      responses:
        '200': { description: "Une liste de matches." } # Schema à définir
        '401': { $ref: '#/components/responses/Unauthorized' }

  /matches/{id}:
    get:
      summary: Obtenir les détails d'un match
      tags: [Matches & Applications]
      security: [ { "bearerAuth": [] } ]
      parameters: [ { $ref: '#/components/parameters/UuidPath' } ]
      responses:
        '200': { description: "Détails du match." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # Applications endpoints are not implemented in controllers; removed from documentation

  # --- ADMIN ---
  /admin/users:
    get:
      summary: (Admin) Lister tous les utilisateurs
      tags: [Admin]
      security: [ { "bearerAuth": [] } ]
      responses:
        '200': { description: "Liste des utilisateurs." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: (Admin) Créer un utilisateur
      tags: [Admin]
      security: [ { "bearerAuth": [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
      responses:
        '201': { description: "Utilisateur créé." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  
  /admin/users/{id}:
    get:
      summary: (Admin) Obtenir les détails d'un utilisateur
      tags: [Admin]
      security: [ { "bearerAuth": [] } ]
      parameters: [ { $ref: '#/components/parameters/UserIdPath' } ]
      responses:
        '200': { description: "Détails de l'utilisateur." }
    put:
      summary: (Admin) Mettre à jour un utilisateur
      tags: [Admin]
      security: [ { "bearerAuth": [] } ]
      parameters: [ { $ref: '#/components/parameters/UserIdPath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
      responses:
        '200': { description: "Utilisateur mis à jour." }
    delete:
      summary: (Admin) Supprimer un utilisateur
      tags: [Admin]
      security: [ { "bearerAuth": [] } ]
      parameters: [ { $ref: '#/components/parameters/UserIdPath' } ]
      responses:
        '204': { description: "Utilisateur supprimé." }

  /health:
    get:
      summary: Vérifier l'état de santé de l'API et de la base de données
      tags: [Health]
      responses:
        '200':
          description: API et base de données en ligne.

  /:
    get:
      summary: Message d'accueil de l'API
      tags: [Health]
      responses:
        '200':
          description: Message de bienvenue.

components:
  # --- Reusable Parameters ---
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: L'ID UUID de la ressource
      schema:
        type: string
        format: uuid

    UuidPath:
      name: id
      in: path
      required: true
      description: L'ID UUID de la ressource
      schema:
        type: string
        format: uuid

    UserIdPath:
      name: id
      in: path
      required: true
      description: L'ID de l'utilisateur
      schema:
        type: string

  # --- Reusable Responses ---
  responses:
    AuthSuccess:
      description: Succès de l'authentification.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponse'
    BadRequest:
      description: La requête est mal formée ou contient des données invalides.
    Unauthorized:
      description: Authentification requise. Le token est manquant ou invalide.
    Forbidden:
      description: Authentifié mais non autorisé à effectuer cette action.
    NotFound:
      description: La ressource demandée n'a pas été trouvée.

  # --- Security Schemes ---
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # --- Schemas (Data Structures) ---
  schemas:
    # --- DTOs (Data Transfer Objects) for Requests ---
    UpdateCandidateProfileDto:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        resumeUrl: { type: string, format: uri }
        coverLetterText: { type: string }
    UpdateRecruiterProfileDto:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        companyId: { type: string, format: uuid }
    UpdateLocationDto:
      type: object
      required: [locationName, locationWKT]
      properties:
        locationName: { type: string }
        locationWKT: { type: string }
    UpdateProfileDto:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        locationWKT: { type: string }
        locationName: { type: string }
        interestedInCategoryIds:
          type: array
          items:
            type: string
            format: uuid
        coverLetterText: { type: string }
        desiredJobTitle: { type: string }
        experienceLevel:
          type: string
          enum: [DEBUTANT, INTERMEDIAIRE, CONFIRME]
        desiredExperienceLevel:
          type: string
          enum: [DEBUTANT, INTERMEDIAIRE, CONFIRME]
        desiredContractTypes:
          type: array
          items:
            type: string
            enum: [CDI, CDD, ALTERNANCE, STAGE, FREELANCE, AUTRE]
        searchDescription: { type: string }
        photoFile:
          type: string
          format: binary
    CreateCompanyDto:
      type: object
      required: [companyName, siret]
      properties:
        companyName: { type: string }
        siret:
          type: string
          minLength: 14
          maxLength: 14
    UpdateCompanyDto:
      type: object
      properties:
        companyName: { type: string }
        siret:
          type: string
          minLength: 14
          maxLength: 14
    CreateJobOfferDto:
      type: object
      required: [title, description, locationWKT]
      properties:
        title: { type: string }
        description: { type: string }
        workHours: { type: string }
        locationWKT: { type: string }
        locationName: { type: string }
        salaryMin: { type: integer }
        salaryMax: { type: integer }
    UpdateJobOfferDto:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        workHours: { type: string }
        locationWKT: { type: string }
        locationName: { type: string }
        salaryMin: { type: integer }
        salaryMax: { type: integer }
        # ... autres champs
    CandidateSwipeDto:
      type: object
      required: [profileId, direction]
      properties:
        profileId: { type: string, format: uuid }
        direction: { type: string, enum: [LEFT, RIGHT] }
    RecruiterSwipeDto:
      type: object
      required: [profileId, direction]
      properties:
        profileId: { type: string, format: uuid }
        direction: { type: string, enum: [LEFT, RIGHT] }
    UpdateApplicationStatusDto:
      type: object
      required: [status]
      properties:
        status: { type: string } # Enum à définir (e.g., WITHDRAWN, INTERVIEW, REJECTED)
    CreateUserDto:
      type: object
      required: [email, password, role]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        role:
          type: string
          enum: [candidate, recruiter, admin]
        candidateData:
          type: object
        recruiterData:
          type: object
    UpdateUserDto:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string }
        candidateData:
          type: object
        recruiterData:
          type: object
    CreateJobCategoryDto:
      type: object
      required: [name]
      properties:
        name: { type: string }
    UpdateJobCategoryDto:
      type: object
      properties:
        name: { type: string }        
    # --- Schemas for Responses & Entities ---
    SignupDto:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
          description: Email unique de l'utilisateur
        password:
          type: string
          minLength: 8
          description: Mot de passe (min 8 caractères, doit contenir majuscule, minuscule et chiffre)
        role:
          type: string
          description: Rôle de l'utilisateur
    LoginDto:
      type: object
      required: [email, password]
      properties:
        email:
          format: email
          description: Email de l'utilisateur
        password:
          type: string
          minLength: 6
          description: Mot de passe
    AuthResponse:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
          description: Token pour renouveler le accessToken
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }
    CandidateProfile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            firstName: { type: string }
            lastName: { type: string }
            resumeUrl: { type: string, format: uri }
            coverLetterText: { type: string }
    RecruiterProfile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            firstName: { type: string }
            lastName: { type: string }
            company: { $ref: '#/components/schemas/Company' }
    Company:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        siret: { type: string }
        logoUrl: { type: string, format: uri }
    JobCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    JobOffer:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        locationWKT: { type: string }
        locationName: { type: string }
